services:
  # PostgreSQL Database
  - type: pserv
    name: devboard-db
    env: docker
    plan: free
    dockerfilePath: ./docker/postgres.Dockerfile
    disk:
      name: data
      mountPath: /var/lib/postgresql/data
    envVars:
      - key: POSTGRES_DB
        value: devboard
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_INITDB_ARGS
        value: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"

  # Node.js Backend
  - type: web
    name: devboard-api
    env: node
    plan: free
    buildCommand: |
      npm ci
      npx prisma generate
      npm run build
    startCommand: |
      npx prisma migrate deploy
      npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: devboard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://yourdomain.vercel.app,https://www.yourdomain.com
      - key: WS_URL
        value: https://devboard-api.onrender.com
    domains:
      - domain: devboard-api.onrender.com

# Auto-deploy from main branch
autoDeploy: true

# Environment variables for production (set these in Render dashboard)
# JWT_SECRET: Generate with: openssl rand -base64 32
# CORS_ORIGIN: Your frontend domains (comma-separated)
# DATABASE_URL: Automatically set from database service
